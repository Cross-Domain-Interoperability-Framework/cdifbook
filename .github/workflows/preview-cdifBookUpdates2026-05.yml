name: Deploy preview (cdifBookUpdates2026-05)

# Builds the cdifBookUpdates2026-05 branch and publishes it to the
# gh-pages branch under /preview-2026-05/, leaving the main-branch
# book at the root untouched. Resulting URL:
#   https://cross-domain-interoperability-framework.github.io/cdifbook/preview-2026-05/

on:
  push:
    branches:
      - cdifBookUpdates2026-05
  workflow_dispatch:

# Shared concurrency group with deploy-main: only one deploy to
# gh-pages runs at a time, so the two never race on a force-push.
# cancel-in-progress: false → queue rather than cancel; we want every
# deploy to complete in turn.
concurrency:
  group: deploy-ghpages
  cancel-in-progress: false

permissions:
  contents: write   # peaceiris/actions-gh-pages pushes to gh-pages

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js (mystmd engine)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install jupyter-book (pinned to local env)
        run: pip install -r requirements.txt

      - name: Build HTML (with subpath base URL)
        env:
          # mystmd bakes BASE_URL into generated absolute links so the
          # site works when served from a subpath rather than domain root.
          BASE_URL: /cdifbook/preview-2026-05
        run: jupyter-book build --html

      - name: Inject footer with clickable links into all index.html
        run: |
          python <<'PY'
          from pathlib import Path
          SCRIPT = """<script>
          /* Footer injection at <body> root, OUTSIDE React's mount tree.
             Two earlier attempts failed:
             1. Putting the footer inside <article> let React's hydration
                strip the <a> tags.
             2. Adding a `.js-footer-loaded` class to body so the CSS
                fallback would hide MyST's plain-text ::after rule caused
                React and our observer to ping-pong over body's class
                attribute during hydration, locking up the main thread.
             Current approach: inject a <style> tag into <head> that
             unconditionally suppresses MyST's plain-text fallback, and
             append the clickable footer div to <body>. React doesn't
             touch <head>, so nothing fights over the style rule, and
             the body-root div survives React's child reconciliation.
             MutationObserver watches body's childList only so the div
             is re-appended if React ever removes it. */
          (function() {
            var STYLE = '.myst-footer-links::after { content: none !important; }';
            var HTML = '<p>We appreciate constructive feedback. Contact us at <a href="mailto:cdif-feedback@codata.org">cdif-feedback@codata.org</a> or file a GitHub Issue at <a href="https://github.com/Cross-Domain-Interoperability-Framework/cdifbook/issues/new/choose">https://github.com/Cross-Domain-Interoperability-Framework/cdifbook/issues/new/choose</a>.</p><p>Copyright (c) 2022-2026 Committee on Data of the International Science Council (CODATA). The Cross Domain Interoperability Framework (CDIF) is licenced under CC-BY-4.0.</p>';
            function ensureStyle() {
              if (!document.head) return;
              if (document.head.querySelector('style[data-cdif-footer]')) return;
              var s = document.createElement('style');
              s.setAttribute('data-cdif-footer', '');
              s.textContent = STYLE;
              document.head.appendChild(s);
            }
            function add() {
              if (!document.body) return;
              ensureStyle();
              if (document.body.querySelector(':scope > .myst-custom-footer')) return;
              var f = document.createElement('div');
              f.className = 'myst-custom-footer';
              f.innerHTML = HTML;
              document.body.appendChild(f);
            }
            function init() {
              add();
              new MutationObserver(add).observe(document.body, {childList: true});
            }
            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', init);
            } else {
              init();
            }
          })();
          </script>"""
          patched = 0
          for html in Path('_build/html').rglob('index.html'):
              text = html.read_text(encoding='utf-8')
              if '</body>' in text and 'myst-custom-footer' not in text:
                  html.write_text(text.replace('</body>', SCRIPT + '</body>'), encoding='utf-8')
                  patched += 1
          print(f"Injected footer script into {patched} index.html files")
          PY

      - name: Deploy to gh-pages subpath
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_build/html
          destination_dir: preview-2026-05
          # keep_files: true preserves everything else on gh-pages
          # (notably the main-branch book at root).
          keep_files: true
          commit_message: "Deploy preview-2026-05 from ${{ github.sha }}"
