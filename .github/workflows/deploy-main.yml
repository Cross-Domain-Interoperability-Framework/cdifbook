name: Deploy main to Pages root

# Builds the main branch and publishes to the root of the gh-pages
# branch, so https://cross-domain-interoperability-framework.github.io/cdifbook/
# always reflects the latest main. The preview-2026-05/ subpath is
# preserved by snapshotting it from gh-pages before publishing.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Shared concurrency group with the preview workflow: only one deploy to
# gh-pages runs at a time, so the two never race on a force-push.
# cancel-in-progress: false → queue rather than cancel; we want every
# deploy to complete in turn.
concurrency:
  group: deploy-ghpages
  cancel-in-progress: false

permissions:
  contents: write   # peaceiris/actions-gh-pages pushes to gh-pages

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js (mystmd engine)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install jupyter-book (pinned to local env)
        run: pip install -r requirements.txt

      - name: Build HTML
        env:
          BASE_URL: /cdifbook
        run: jupyter-book build --html

      - name: Inject footer with clickable links into all index.html
        run: |
          python <<'PY'
          from pathlib import Path
          SCRIPT = """<script>
          /* Footer injection: real <a> tags + survives SPA navigation.
             Tags <body> with .js-footer-loaded so the CSS fallback (used
             only when this script does not run, e.g. local dev) turns off. */
          (function() {
            function add() {
              var links = document.querySelector('.myst-footer-links');
              if (!links) return;
              if (links.parentElement.querySelector('.myst-custom-footer')) return;
              var f = document.createElement('div');
              f.className = 'myst-custom-footer';
              f.innerHTML = '<p>We appreciate constructive feedback. Contact us at <a href="mailto:cdif-feedback@codata.org">cdif-feedback@codata.org</a> or file a GitHub Issue at <a href="https://github.com/Cross-Domain-Interoperability-Framework/cdifbook/issues/new/choose">https://github.com/Cross-Domain-Interoperability-Framework/cdifbook/issues/new/choose</a>.</p><p>Copyright (c) 2026 Committee on Data of the International Science Council (CODATA). The Cross Domain Interoperability Framework (CDIF) is licenced under CC-BY-4.0.</p>';
              links.after(f);
            }
            function init() {
              document.body.classList.add('js-footer-loaded');
              add();
              new MutationObserver(add).observe(document.body, {childList: true, subtree: true});
            }
            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', init);
            } else {
              init();
            }
          })();
          </script>"""
          patched = 0
          for html in Path('_build/html').rglob('index.html'):
              text = html.read_text(encoding='utf-8')
              if '</body>' in text and 'myst-custom-footer' not in text:
                  html.write_text(text.replace('</body>', SCRIPT + '</body>'), encoding='utf-8')
                  patched += 1
          print(f"Injected footer script into {patched} index.html files")
          PY

      - name: Checkout gh-pages to snapshot preview-2026-05
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-current

      - name: Merge preview-2026-05 into deploy directory
        run: |
          if [ -d gh-pages-current/preview-2026-05 ]; then
            cp -r gh-pages-current/preview-2026-05 _build/html/preview-2026-05
            echo "Preserved preview-2026-05/ from gh-pages."
          else
            echo "No preview-2026-05/ on gh-pages; nothing to preserve."
          fi

      - name: Deploy to gh-pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_build/html
          # No destination_dir → publish to gh-pages root.
          # keep_files: false fully replaces gh-pages root with the new
          # build. preview-2026-05/ survives because it was copied into
          # _build/html/ in the prior step. Stale hashed asset files
          # from earlier builds get garbage-collected this way.
          keep_files: false
          commit_message: "Deploy main to gh-pages root from ${{ github.sha }}"
