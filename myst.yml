version: 1
project:
  title: Cross Domain Interoperability Framework Handbook
  github: Cross-Domain-Interoperability-Framework/cdifbook
  bibliography:
    - references.bib
  exports:
    - format: pdf
      template: plain_latex_book
      output: exports/book.pdf
  toc:
    - file: introduction.md
    - title: Overview
      children: 
        - file: background/whycdif.md
        - file: background/structure.md
        - file: background/conformance.md
        - file: background/principles.md
        - file: background/development.md
        - file: background/checklistForImplementation.md
    - title: Metadata Technical Expression
      children:
        - file: metadata/recommendations.md
        - file: metadata/technicalexpressionmetadata.md
          children:
            - file: metadata/distributionapis.md
            - file: metadata/queryabledistributions.md
            - file: metadata/publishingmetadata.md
            - file: metadata/publication.md
    - title: Profiles/Recommendations
      children:
      - file: metadata/profilesoverview.md
      - file: metadata/core.md
        children:
          - file: metadata/coreSchemaImplementationNew.md
      - file: metadata/discovery.md
      - file: controlled_vocabularies/vocabintro.md
        children:
          - file: controlled_vocabularies/conceptprofile.md
          - file: controlled_vocabularies/codelistprofile.md
      - file: data_description/datadescriptionforintegration.md
        children:
          - file: data_description/datadescriptionprofile.md
          - file: data_description/datastructureprofile.md
            children:
            - file: data_description/dataStructureSchemaImplementationNew.md
      - file: manifest/manifest.md
      - file: data_access/intro.md
        children:
          - file: data_access/odrloverview.md
          - file: data_access/policies.md
          - file: data_access/odrlinternalpolicies.md
          - file: data_access/odrlaggregateaccessconditions.md
          - file: data_access/odrlsharedservices.md
          - file: data_access/odrlfederatedanalysis.md
          - file: data_access/odrlincdif.md
      - file: universals/univintro.md
        children:
          - file: universals/univgeography.md
          - file: universals/univtime.md
          - file: universals/univuom.md
    - title: Open Topics, Future Profiles
      children:
      - file: future/FullIntegration.md
        children:
          - file: future/FAIRMappings.md
          - file: data_description/datadescriptionforintegration.md
          - file: data_description/dataintegrationstandards.md
      - file: future/provenance.md
      - file: future/context.md
      - file: future/perspectives-ai.md
    - title: Implementation Resources
      children:
        - file: metadata/datatypes.md
        - file: metadata/schemaOrgImplementationpatterns.md
        - file: examples/index.md
        - file: metadata/dcat.md
        - file: metadata/mapping.md
          children:
            - file: metadata/pidkernel.md
            - file: metadata/signpostinglinkrel.md
site:
  options:
    logo: CDIF_LOGO.jpg
    folders: true
    style: _static/custom.css
  template: book-theme
